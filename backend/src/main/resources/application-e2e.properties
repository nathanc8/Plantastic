spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:data-e2e.sql
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=false
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
api.key=test_api_key

cloudinary.cloud_name=cloud_name_test
cloudinary.api_key=cloud_key_test
cloudinary.api_secret=cloud_secret_test

frontend_prod_url=http://localhost:5173
frontend_staging_url=http://localhost:5173